[package]
name = "swf-spike"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "list-swf"
path = "src/bin/list_swf.rs"

[[bin]]
name = "render-map"
path = "src/bin/render_map.rs"

[[bin]]
name = "render-player"
path = "src/bin/render_player.rs"

[[bin]]
name = "dump-anim"
path = "src/bin/dump_anim.rs"

[[bin]]
name = "render-tile"
path = "src/bin/render_tile.rs"

[[bin]]
name = "render-cast-sheet"
path = "src/bin/render_cast_sheet.rs"

[[bin]]
name = "print-bounds"
path = "src/bin/print_bounds.rs"

[[bin]]
name = "dump-avm1"
path = "src/bin/dump_avm1.rs"

[[bin]]
name = "render-avm1-sheet"
path = "src/bin/render_avm1_sheet.rs"

[[bin]]
name = "dump-placements"
path = "src/bin/dump_placements.rs"

[[bin]]
name = "dump-fills"
path = "src/bin/dump_fills.rs"

[[bin]]
name = "dump-root"
path = "src/bin/dump_root.rs"

[[bin]]
name = "dump-symbols"
path = "src/bin/dump_symbols.rs"

[[bin]]
name = "render-spell-with-player"
path = "src/bin/render_spell_with_player.rs"

[dependencies]
swf = "0.2"
vello = "0.8"
wgpu = "28"
pollster = "0.4"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
flate2 = "1"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"

[patch.crates-io]
wgpu = { path = "../../patches/wgpu" }

[[bin]]
name = "inspect-tags"
path = "src/bin/inspect_tags.rs"

[[bin]]
name = "dump-morph"
path = "src/bin/dump_morph.rs"

[[bin]]
name = "dump-interp-morph"
path = "src/bin/dump_interp_morph.rs"

[[bin]]
name = "test-quad"
path = "src/bin/test_quad.rs"

[[bin]]
name = "check-anim-tile"
path = "src/bin/check_anim_tile.rs"

[[bin]]
name = "check-tile-kind"
path = "src/bin/check_tile_kind.rs"

[[bin]]
name = "dump-export"
path = "src/bin/dump_export.rs"

[[bin]]
name = "dump-sprite-id"
path = "src/bin/dump_sprite_id.rs"

[[bin]]
name = "find-high-frame"
path = "src/bin/find_high_frame.rs"

[[bin]]
name = "find-anim-children"
path = "src/bin/find_anim_children.rs"

[[bin]]
name = "find-animated"
path = "src/bin/find_animated.rs"
